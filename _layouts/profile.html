<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}{% unless page.profile_home %} — Haoyuan Zhang{% endunless %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.profile_organization %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="Haoyuan Zhang / 张皓原">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{ '/assets/profile/portrait.jpeg' | absolute_url }}">
<meta name="theme-color" content="#fcfdfd">
<link rel="icon" href="{{ '/images/site-logo.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/profile/style.css' | relative_url }}">
{% unless page.profile_home %}<link rel="stylesheet" href="{{ '/assets/profile/pages.css' | relative_url }}">{% endunless %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="header"><nav class="container nav" aria-label="Home"><a class="brand" href="{{ '/' | relative_url }}" aria-label="Haoyuan Zhang home">hz<span>.</span></a></nav></header>
<main id="main" class="container{% unless page.profile_home %} subpage{% endunless %}">{{ content }}</main>
<footer class="container footer"><span>© {{ site.time | date: "%Y" }} Haoyuan Zhang <span lang="zh">/ 张皓原</span></span><div><a href="https://github.com/haoyuanz13">GitHub ↗</a><a href="https://www.linkedin.com/in/haoyuanz">LinkedIn ↗</a><a href="mailto:haoyuanzgoahead@outlook.com">Email ↗</a></div></footer>
<script src="{{ '/assets/profile/visitor-counter.js' | relative_url }}" defer></script>
{% if page.profile_home %}<script src="{{ '/assets/profile/visitor-map.js' | relative_url }}" defer></script>{% endif %}
{% if page.profile_catalogue %}<script src="{{ '/assets/profile/pages.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
